name: Python CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'  # Specify the Python version your application uses

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest  # Replace with your test framework or command if different

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Deploy application to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Deploying to Render..."
          curl -X POST \ 
          -H "Authorization: Bearer $RENDER_API_KEY" \ 
          -H "Content-Type: application/json" \ 
          -d '{"serviceId": "<YOUR_SERVICE_ID>", "clearCache": false , "dockerfileName": "Dockerfile"}' \ 
          https://api.render.com/v1/services/<YOUR_SERVICE_ID>/deploys

      - name: Notify deployment success
        run: |
          echo "Deployment to Render completed successfully!"
