<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Validation</title>
    <style>
        .cssbuttonss-io {
            position: relative;
            font-family: inherit;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.05em;
            border-radius: 0.8em;
            cursor: pointer;
            border: none;
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            color: ghostwhite;
            overflow: hidden;
            margin-top: 1em;
        }

        .cssbuttonss-io svg {
            width: 1.2em;
            height: 1.2em;
            margin-right: 0.5em;
        }

        .cssbuttonss-io span {
            position: relative;
            z-index: 10;
            transition: color 0.4s;
            display: flex;
            align-items: center;
            padding: 0.8em 1.2em 0.8em 1.05em;
        }

        .cssbuttonss-io::before,
        .cssbuttonss-io::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .cssbuttonss-io::before {
            content: "";
            background: #000;
            /* background-color:  #495057; */
            width: 120%;
            left: -10%;
            transform: skew(30deg);
            transition: transform 0.4s cubic-bezier(0.3, 1, 0.8, 1);
        }

        .cssbuttonss-io:hover::before {
            transform: translate3d(100%, 0, 0);
        }

        .cssbuttonss-io:active {
            transform: scale(0.95);
        }

        h2 {
            font-size: larger;
        }

        .inputField {
            width: 100%;
            height: 30px;
            /* background-color: transparent; */
            /* border: none; */
            border-bottom: 2px solid rgb(173, 173, 173);
            margin: 10px 0;
            color: black;
            font-size: .8em;
            font-weight: 500;
            box-sizing: border-box;
            /* padding-left: 30px; */
        }

        .inputField:focus {
            outline: none;
            border-bottom: 2px solid rgb(199, 114, 255);
        }

        .inputField::placeholder {
            color: rgb(80, 80, 80);
            font-size: 1em;
            font-weight: 500;
            /* border-radius: 50%; */
        }
    </style>
</head>

<body>
    <h2>Enter the OTP sent to your email</h2><br>
    <form action="{{ url_for('main.validate_otp') }}" method="post">
        <label for="otp">OTP:</label>
        <input type="text" id="otp_signup" name="otp_signup" placeholder="Enter OTP Here" class="inputField"><br>
        <!-- <button type="submit">Submit</button> -->
        <button class="cssbuttonss-io" type="submit">
            <span>
                <path d="M0 0h24v24H0z" fill="none"></path>
                <path
                    d="M24 12l-5.657 5.657-1.414-1.414L21.172 12l-4.243-4.243 1.414-1.414L24 12zM2.828 12l4.243 4.243-1.414 1.414L0 12l5.657-5.657L7.07 7.757 2.828 12zm6.96 9H7.66l6.552-18h2.128L9.788 21z"
                    fill="currentColor"></path>
                </svg>
                <a href="#" class="links">Validate OTP</a>
            </span>
        </button>
    </form>

</body>

</html>
