{% extends "base.html" %}
{% block head %}
{{ super() }}
{% endblock %}

{% block content %}

<style>
     .show_admin_authentication {
            border: 2px solid brown;
            /* width: 100%; */
            height: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .adminForm {
            border: 2px solid black;
            border-radius: 2em;
            text-align: center;
            padding: 2em;
        }

        .show_admin_authentication input {
            margin-bottom: 1em;

        }

        .show_admin_authentication label {
            font-weight: bolder;
        }

        .cssbuttons-io {
            position: relative;
            font-family: inherit;
            font-weight: 500;
            font-size: 16px;
            letter-spacing: 0.05em;
            border-radius: 0.8em;
            cursor: pointer;
            border: none;
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            color: ghostwhite;
            overflow: hidden;
        }

        .cssbuttons-io svg {
            width: 1.2em;
            height: 1.2em;
            margin-right: 0.5em;
        }

        .cssbuttons-io span {
            position: relative;
            z-index: 10;
            transition: color 0.4s;
            display: flex;
            align-items: center;
            padding: 0.8em 1.2em 0.8em 1.05em;
        }

        .cssbuttons-io::before,
        .cssbuttons-io::after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .cssbuttons-io::before {
            content: "";
            background: #000;
            /* background-color:  #495057; */
            width: 120%;
            left: -10%;
            transform: skew(30deg);
            transition: transform 0.4s cubic-bezier(0.3, 1, 0.8, 1);
        }

        .cssbuttons-io:hover::before {
            transform: translate3d(100%, 0, 0);
        }

        .cssbuttons-io:active {
            transform: scale(0.95);
        }


        .inputField {
            width: 100%;
            height: 30px;
            /* background-color: transparent; */
            /* border: none; */
            border-bottom: 2px solid rgb(173, 173, 173);
            margin: 10px 0;
            color: black;
            font-size: .8em;
            font-weight: 500;
            box-sizing: border-box;
            padding-left: 30px;
        }

        .inputField:focus {
            outline: none;
            border-bottom: 2px solid rgb(199, 114, 255);
        }

        .inputField::placeholder {
            color: rgb(80, 80, 80);
            font-size: 1em;
            font-weight: 500;
            border-radius: 50%;
        }
</style>

<div class="show_admin_authentication">
    {% if show_admin_login %}
    <h1>Admin/Faculty Login</h1>
    <form action="{{ url_for('main.validate_admin') }}" method="post">
        <label for="username">Admin ID:</label>
        <input type="text" id="admin_id" name="admin_id" required><br>
        <label for="password">Admin Password:</label>
        <input type="password" id="admin_password" name="admin_password" required><br>
        <button type="submit">Login</button>
    </form>
    {% endif %}
</div>



{% endblock %}
